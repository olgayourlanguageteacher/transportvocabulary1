<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transport &amp; Travel: Match Up</title>
<style>
:root{--bg:#fff6d6;--ink:#14284b;--card:#fff;--line:#d9c98a;--accent:#f2b705;--ok:#2e9e5b;--bad:#d64545;--tile:#14284b;--tileink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a30;--ink:#f4ecd0;--card:#1b2a4a;--line:#3a4a70;--tile:#f2b705;--tileink:#14284b}}
:root[data-theme="dark"]{--bg:#101a30;--ink:#f4ecd0;--card:#1b2a4a;--line:#3a4a70;--tile:#f2b705;--tileink:#14284b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{margin:0;font-size:1.5rem;font-weight:800}
.stats{display:flex;gap:8px;font-weight:700}
.stats span{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px}
.hint{margin:0 0 12px;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.slot{background:var(--card);border:3px dashed var(--line);border-radius:14px;overflow:hidden;transition:border-color .15s}
.slot img{display:block;width:100%;aspect-ratio:2/1.1;object-fit:cover}
.drop{min-height:48px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;padding:6px;cursor:pointer}
.slot.over,.slot.target{border-color:var(--accent);border-style:solid}
.slot.ok{border:3px solid var(--ok)}.slot.ok .drop{background:var(--ok);color:#fff}
.slot.no{animation:sh .35s;border-color:var(--bad)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0;min-height:56px;padding:12px;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.tile{background:var(--tile);color:var(--tileink);border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:800;font-size:1.05rem;cursor:grab;touch-action:none}
.tile.sel{outline:4px solid var(--accent);outline-offset:2px}
.tile:focus-visible,.drop:focus-visible,button.big:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:10px;justify-content:center}
button.big{background:var(--accent);color:#14284b;border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
button.big[hidden]{display:none}
.done{text-align:center;font-size:1.3rem;font-weight:800;margin:14px}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:1.2rem}}
@media(prefers-reduced-motion:reduce){.slot.no{animation:none}}
</style></head><body><div class="wrap">
<header><h1>Transport &amp; Travel: Match up</h1>
<div class="stats"><span id="rd"></span><span id="sc"></span><span id="tm">0:00</span></div></header>
<p class="hint">Drag each word onto its picture, or tap a word and then tap a picture.</p>

<div class="bank" id="bank"></div>
<div class="done" id="done" hidden></div>
<div class="bar"><button class="big" id="next" hidden>Next round</button><button class="big" id="again" hidden>Play again</button></div>
</div>

const $=id=>document.getElementById(id);
let order,round,score,mistakes,sel,t0,timer,solved;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){order=shuffle(D);round=0;score=0;mistakes=0;t0=Date.now();clearInterval(timer);timer=setInterval(tick,1000);$('again').hidden=true;$('done').hidden=true;load()}
function tick(){const s=(Date.now()-t0)/1000|0;$('tm').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function load(){
 sel=null;solved=0;$('next').hidden=true;
 const set=order.slice(round*6,round*6+6);
 $('rd').textContent='Round '+(round+1)+' of '+Math.ceil(order.length/6);
 $('sc').textContent='Score '+score;
 const g=$('grid');g.innerHTML='';
 set.forEach(it=>{const s=document.createElement('div');s.className='slot';s.dataset.w=it.w;
  s.innerHTML='<img alt="Picture to match" src="'+it.img+'"><div class="drop" tabindex="0" role="button" aria-label="Drop zone"></div>';
  s.addEventListener('dragover',e=>{e.preventDefault();if(!s.classList.contains('ok'))s.classList.add('over')});
  s.addEventListener('dragleave',()=>s.classList.remove('over'));
  s.addEventListener('drop',e=>{e.preventDefault();s.classList.remove('over');const id=e.dataTransfer.getData('text/plain');const t=document.querySelector('.tile[data-w="'+CSS.escape(id)+'"]');if(t)place(t,s)});
  s.querySelector('.drop').addEventListener('click',()=>{if(sel)place(sel,s)});
  s.querySelector('.drop').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&sel){e.preventDefault();place(sel,s)}});
  g.appendChild(s)});
 const b=$('bank');b.innerHTML='';
 shuffle(set).forEach(it=>{const t=document.createElement('button');t.className='tile';t.textContent=it.w;t.dataset.w=it.w;t.draggable=true;
  t.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',it.w)});
  t.addEventListener('click',()=>{if(sel)sel.classList.remove('sel');if(sel===t){sel=null;return}sel=t;t.classList.add('sel')});
  b.appendChild(t)});
}
function place(t,s){
 if(s.classList.contains('ok'))return;
 if(t.dataset.w===s.dataset.w){
  s.classList.add('ok');s.querySelector('.drop').textContent=t.dataset.w;t.remove();sel=null;score++;solved++;$('sc').textContent='Score '+score;
  if(solved===document.querySelectorAll('.slot').length)finish();
 }else{
  mistakes++;s.classList.remove('no');void s.offsetWidth;s.classList.add('no');
  if(sel){sel.classList.remove('sel');sel=null}
 }
}
function finish(){
 if((round+1)*6<order.length){$('next').hidden=false}
 else{clearInterval(timer);$('done').hidden=false;$('done').textContent='Well done! '+score+' / '+order.length+' matched, '+mistakes+' wrong '+(mistakes===1?'try':'tries')+', time '+$('tm').textContent;$('again').hidden=false}
}
$('next').onclick=()=>{round++;load()};
$('again').onclick=start;
start();
</script></body></html>
